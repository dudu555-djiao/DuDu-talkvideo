   onSave:async p=>{feValidate(p);const store=read(),fs=feState(store),id=p.id||crypto.randomUUID();if(fs.proposals[id])throw new Error('提案ID已存在，请另存新提案');const beforeDraft=copy(fs.drafts[dk]||null);const saved={...copy(p),id,source:feBindSource(scene,frame,p.source),status:'pending-ai',appliedAt:null,createdAt:p.createdAt||new Date().toISOString(),proposalOnly:true};fs.proposals[id]=saved;delete fs.drafts[dk];addEdit(store,{type:'frame-proposal',kind:'frame-proposal',label:'保存精确编辑提案',stableId:scene.stableId,identity:sceneIdentity(scene),masterSha256:data.master?.sha256||null,sourceSha256:data.frameEditor.sourceSha256,proposalId:id,draftKey:dk,beforeDraft,before:null,after:copy(saved)});const ok=writeStore(store);applyFilter();document.dispatchEvent(new Event('change'));if(!ok)throw new Error('提案暂存在当前页，浏览器容量不足；请先导出备份');message('精确编辑提案已保存，等待 AI 按坐标执行；成片尚未改动。');},
   onClose:()=>{feSession=null;applyFilter()}
  });
 }catch(e){feSession=null;message('编辑器打开失败：'+e.message,true)}
}
function feInstall(){
 for(const scene of scenes){const c=cards.get(scene.stableId);const b=el('button','frame-edit-button','编辑本帧');b.setAttribute('aria-label',`第${scene.number}段编辑本帧`);b.disabled=!data.frameEditor?.sourceUrl||!scene.frames.length||(data.frameEditor.availableScenes&&!data.frameEditor.availableScenes.includes(scene.stableId));b.title=b.disabled?'本段尚未接入可编辑对象源':'进入精确坐标编辑；保存为 AI 修改提案';b.onclick=()=>feOpen(scene,scene.frames[c.frameIndex]);c.frameView.querySelector('.frame-controls')?.append(b);const list=el('details','frame-proposals');c.frameProposals=list;c.history.parentNode.insertBefore(list,c.history);feRefreshList(scene)}
}
feInstall();

// Keep the original browser persistence/exporter; mirror raw stores and original Blobs to this project.
window.segmentWorkbench.projectSync=window.WorkbenchProjectSync?.connect({
 projectId:data.episodeKey,storageKey:key,ready,
 context:{episodeKey:data.episodeKey,stage:data.stage,revision:data.revision,storyboardSha256:data.storyboardSha256,currentOutputSha256:data.master?.sha256||null,metadata:data.metadata,historyRecords:data.historyRecords},
 store:()=>copy(read()),assets:()=>[...assets.values()],waitPending:async()=>{await ready;await Promise.all([...pending]);},
 restore:async(store,list)=>{
  if(list.length)await transaction('readwrite',s=>{let q;for(const a of list)q=s.put(a);return q;});
  for(const a of list)assets.set(a.id,a);
  cachedStore=copy(store);volatileStore=null;drafts.clear();
  try{localStorage.setItem(key,JSON.stringify(cachedStore));}catch{volatileStore=cachedStore;}
  for(const s of scenes)editorState.get(s.stableId)?.load();applyFilter();updateUndoButtons();
 }
});

})();
