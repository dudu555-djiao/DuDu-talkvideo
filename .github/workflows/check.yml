name: Installation and render check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Offline installation and actual MP4 check
        run: python scripts/bootstrap.py --smoke-test
      - name: Partial render planning and AAC variant copy checks
        run: python tests/media_helpers_smoke.py

      - name: Six themes, three mascots and public asset boundary
        run: |
          python tests/themes_smoke.py
          python tests/public_assets_check.py

      - name: Presenter intake and project-local feedback storage
        run: |
          python tests/workflow_intake_test.py
          python workbench/tests/test_cli.py
          python workbench/tests/test_feedback_store.py
